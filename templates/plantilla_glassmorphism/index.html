<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{titulo_pagina}}</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Preload de fuentes más comunes para evitar CORB -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">


  <style>
    .profile-pic {
      width: {{tamano_foto}};
      height: auto;
      margin-top: 25px;
      border-radius: {{borde}};
    }

    /* Fuente para el título principal (h2) */
    h2 {
      font-family: {{fuente_titulo}}, 'Arial', 'Helvetica', sans-serif;
    }
    
    /* Fuente para el subtítulo (h3) */
    h3 {
      font-family: {{fuente_subtitulo}}, 'Arial', 'Helvetica', sans-serif;
    }
    
    /* Fuente para el resto del contenido */
    body, h1, h4, h5, h6, p, a, span, div, footer, button {
      font-family: {{fuente_general}}, 'Arial', 'Helvetica', sans-serif;
    }
  </style>
</head>

<body style="background: {{fondo}}; background-size: cover; background-position: center;">
  <div class="page-wrapper">
    <div class="container">
      <img src="{{imagen}}" alt="Foto de perfil" class="profile-pic" />
      <h2 style="color: {{color_titulo}}; font-size: {{tamano_titulo}}; margin-bottom: {{mb_titulo}}; margin-top: {{mt_titulo}}">{{titulo}}</h2>
      <h3 style="color: {{color_subtitulo}}; font-size: {{tamano_subtitulo}}; margin-bottom: {{mb_subtitulo}}; margin-top: {{mt_subtitulo}}">{{subtitulo}}</h3>

      <div class="social-buttons">
        {{botones}}
      </div>

      {{boton_contacto}}
    </div>

    <footer style="color: {{color_footer}};">
      Powered by
      <a href="https://www.gibracompany.com/" target="_blank" style="color: {{color_footer}};">Gibra Company</a>
    </footer>
  </div>

<script>

  function cargarFuentesAdicionales() {
    // Solo cargar fuentes que no están preloadadas
    const fuentesAdicionales = {
      'Playfair Display': 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap',
      'Source Sans Pro': 'https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap',
      'Poppins': 'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap',
      'Nunito': 'https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap'
    };
    
    try {
      const h2Element = document.querySelector('h2');
      const h3Element = document.querySelector('h3');
      const bodyElement = document.querySelector('body');
      
      const fuentesNecesarias = new Set();
      
      [h2Element, h3Element, bodyElement].forEach(element => {
        if (element) {
          const fuente = window.getComputedStyle(element).fontFamily.split(',')[0].replace(/['"]/g, '').trim();
          if (fuentesAdicionales[fuente]) {
            fuentesNecesarias.add(fuente);
          }
        }
      });
      
      // Cargar solo las fuentes adicionales necesarias
      fuentesNecesarias.forEach(fuente => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = fuentesAdicionales[fuente];
        link.media = 'print';
        link.onload = function() { this.media = 'all'; };
        document.head.appendChild(link);
      });
    } catch (error) {
      console.log('Error cargando fuentes adicionales:', error);
    }
  }

  // Cargar fuentes adicionales después del DOM
  document.addEventListener("DOMContentLoaded", cargarFuentesAdicionales);     

  // Registrar visita
  fetch("https://api.gibracompany.com/api/registro-visita", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      subdominio: window.location.hostname,
      userAgent: navigator.userAgent,
      referrer: document.referrer,
      fecha: new Date().toISOString()
    })
  });

  // Registrar clic en botones con clase "rastreo"
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".rastreo").forEach(boton => {
      boton.addEventListener("click", () => {
        const nombre = boton.getAttribute("data-nombre") || "desconocido";
        fetch("https://api.gibracompany.com/api/registro-click", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            subdominio: window.location.hostname,
            boton: nombre,
            fecha: new Date().toISOString()
          })
        });
      });
    });
  });
</script>
</body>
</html>
